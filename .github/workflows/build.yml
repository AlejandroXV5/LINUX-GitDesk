name: Build

# Pull requests are tested. Every push to main is tested, built and published as a
# GitHub release: the .deb/.rpm/.AppImage that install.sh and GitDesk's updater
# download, so nobody has to compile GitDesk to install or update it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 22.04's older glibc keeps the packages installable on Ubuntu 22.04+,
    # Debian 12+ and current Fedora.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes list the commits since the previous release

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the packages
        id: bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # 0.1.<run number>: always higher than the last build, so apt/dnf upgrade to it.
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run tauri build -- --config "{\"version\":\"$version\"}"

      - name: Publish the release
        if: steps.bundle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage out/
          (cd out && sha256sum * > SHA256SUMS)

          prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')
          {
            echo "Compilado desde el commit ${GITHUB_SHA::7}."
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              echo "## Cambios desde $prev"
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"
            else
              echo "Primera versión publicada."
            fi
            echo
            echo "**Instalar:** \`git clone https://github.com/${GITHUB_REPOSITORY}.git ~/gitdesk && bash ~/gitdesk/install.sh\`"
            echo "(o descarga el paquete de tu distribución aquí abajo). GitDesk avisa solo cuando hay una versión nueva."
          } > notes.md

          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "GitDesk $VERSION" --notes-file notes.md --latest

          # Keep the ten most recent releases.
          gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
