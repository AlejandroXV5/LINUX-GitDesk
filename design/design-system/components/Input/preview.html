<!-- @dsCard group="Foundations" height=280 -->
<div class="ds-root">
  <label class="field">
    <span class="field-label">Filter</span>
    <span class="search">
      <svg viewBox="0 0 16 16"><circle cx="6.75" cy="6.75" r="4.25" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Filter branches" value="release" />
    </span>
  </label>
  <label class="field">
    <span class="field-label">Repository</span>
    <span class="select">
      <span>dev</span>
      <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </label>
  <label class="field">
    <span class="field-label">Commit message</span>
    <textarea placeholder="Enter a message  <Required>" required></textarea>
  </label>
  <label class="field">
    <span class="field-label">Disabled</span>
    <input type="text" value="origin/main" disabled />
  </label>
</div>
<style>
  .ds-root{font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-5);max-width:280px}
  .field{display:flex;flex-direction:column;gap:var(--space-2)}
  .field-label{font-size:11px;line-height:14px;font-weight:600;color:var(--ink-secondary);text-transform:uppercase;letter-spacing:.02em}
  input,textarea,.select{font-family:var(--font-sans);font-size:13px;line-height:18px;color:var(--ink);background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:5px var(--space-3)}
  input,.select{height:28px}
  input::placeholder,textarea::placeholder{color:var(--ink-secondary)}
  input:focus,textarea:focus{outline:2px solid var(--focus-ring);outline-offset:-1px;border-color:transparent}
  input:disabled{color:var(--ink-disabled);background:var(--surface-200)}
  textarea{min-height:72px;resize:none;font-family:var(--font-sans)}
  .search{display:flex;align-items:center;gap:var(--space-2);height:28px;background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:0 var(--space-3);color:var(--ink-secondary)}
  .search svg{width:14px;height:14px;flex:none}
  .search input{border:none;background:transparent;padding:0;height:auto;flex:1;color:var(--ink)}
  .search input:focus{outline:none}
  .select{display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--ink)}
  .select svg{width:12px;height:12px;color:var(--ink-secondary)}
</style>
