<!-- @dsCard group="App shell" height=90 -->
<div class="ds-root">
  <div class="toolbar">
    <button class="t-btn" title="Fetch"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Fetch</span></button>
    <button class="t-btn" title="Pull"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 5.2v5.6M5.6 8l2.4 2.4L10.4 8" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Pull</span></button>
    <button class="t-btn"><svg viewBox="0 0 16 16"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Push</span><span class="count">2</span></button>
    <span class="sep"></span>
    <button class="t-btn"><svg viewBox="0 0 16 16"><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><path d="M5 5.6V10.4M6.3 8A3.2 3.2 0 0 0 9.4 9.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><span>Branch</span></button>
    <button class="t-btn"><svg viewBox="0 0 16 16"><rect x="2.5" y="4" width="11" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M2.5 7h11" stroke="currentColor" stroke-width="1.5"/></svg><span>Stash</span></button>
    <span class="spacer"></span>
    <span class="search">
      <svg viewBox="0 0 16 16"><circle cx="6.75" cy="6.75" r="4.25" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input placeholder="Search commits" />
    </span>
  </div>
</div>
<style>
  .ds-root{font-family:var(--font-sans)}
  .toolbar{height:44px;display:flex;align-items:center;gap:var(--space-2);background:var(--surface-200);border-bottom:1px solid var(--border-subtle);padding:0 var(--space-4)}
  .t-btn{position:relative;display:flex;align-items:center;gap:var(--space-2);height:28px;padding:0 var(--space-3);background:transparent;border:none;border-radius:var(--radius-sm);color:var(--ink);font-family:var(--font-sans);font-size:12px;cursor:pointer}
  .t-btn svg{width:16px;height:16px;flex:none}
  .t-btn:hover{background:var(--surface-hover)}
  .t-btn .count{background:var(--status-modified);color:var(--ink-inverse);font-size:10px;font-weight:700;padding:0 4px;border-radius:var(--radius-full);line-height:14px}
  .sep{width:1px;height:20px;background:var(--border-subtle);margin:0 var(--space-2)}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:var(--space-2);height:26px;width:180px;background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:0 var(--space-3);color:var(--ink-secondary)}
  .search svg{width:13px;height:13px;flex:none}
  .search input{border:none;background:transparent;font-family:var(--font-sans);font-size:12px;color:var(--ink);flex:1;outline:none}
</style>
