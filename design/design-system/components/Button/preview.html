<!-- @dsCard group="Foundations" height=210 -->
<div class="ds-root">
  <div class="row">
    <button class="btn btn-primary">Commit All</button>
    <button class="btn btn-secondary">Amend</button>
    <button class="btn btn-ghost">Discard</button>
    <button class="btn btn-primary" disabled>Commit All</button>
  </div>
  <div class="row">
    <button class="btn-icon" title="Fetch"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="btn-icon" title="Pull"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 5.2v5.6M5.6 8l2.4 2.4L10.4 8" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn-icon active" title="Push (2 outgoing)"><svg viewBox="0 0 16 16"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dot"></span></button>
    <button class="btn-icon" disabled title="Stash"><svg viewBox="0 0 16 16"><rect x="2.5" y="4" width="11" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M2.5 7h11" stroke="currentColor" stroke-width="1.5"/></svg></button>
  </div>
  <div class="row">
    <button class="btn btn-danger">Delete Branch</button>
  </div>
</div>
<style>
  .ds-root{font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-5)}
  .row{display:flex;align-items:center;gap:var(--space-4)}
  .btn{font-size:13px;line-height:18px;font-weight:400;padding:5px var(--space-4);border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer}
  .btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
  .btn-primary{background:var(--brand-solid);color:var(--ink-inverse)}
  .btn-primary:hover:not(:disabled){background:var(--brand-solid-hover)}
  .btn-primary:disabled{background:var(--surface-hover);color:var(--ink-disabled);cursor:default}
  .btn-secondary{background:transparent;color:var(--ink);border-color:var(--border-control)}
  .btn-secondary:hover{background:var(--surface-hover)}
  .btn-ghost{background:transparent;color:var(--ink-secondary)}
  .btn-ghost:hover{background:var(--surface-hover);color:var(--ink)}
  .btn-danger{background:transparent;color:var(--status-deleted);border-color:var(--status-deleted)}
  .btn-danger:hover{background:var(--surface-hover)}
  .btn-icon{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--ink);cursor:pointer}
  .btn-icon svg{width:16px;height:16px}
  .btn-icon:hover:not(:disabled){background:var(--surface-hover)}
  .btn-icon.active{color:var(--brand)}
  .btn-icon:disabled{color:var(--ink-disabled);cursor:default}
  .btn-icon:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
  .btn-icon .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:var(--radius-full);background:var(--status-modified)}
</style>
