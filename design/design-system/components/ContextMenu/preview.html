<!-- @dsCard group="Overlays" height=460 subtitle="Right-click on a branch or tag" -->
<div class="ds-root">
  <div class="row-context">
    <svg class="ic remote" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="txt">origin/stage</span>
  </div>
  <div class="ctxmenu">
    <button class="ctx-item"><span class="ic"></span><span class="lbl">Checkout</span></button>
    <button class="ctx-item"><span class="ic"></span><span class="lbl">Checkout Tip Commit (--detach)</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M6.5 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V9.5M9.5 2H14v4.5M14 2 7.5 8.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Open in Browser</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12.5" r="1.4" fill="currentColor"/><path d="M4.5 5V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="11.5" cy="11" r="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M11.5 9.6v2.8M10.1 11h2.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span class="lbl">New Local Branch From...</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12.5" r="1.4" fill="currentColor"/><circle cx="11.5" cy="12.5" r="1.4" fill="currentColor"/><path d="M4.5 5V11M4.5 8A5 5 0 0 0 11.5 11" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg><span class="lbl">Merge 'origin/stage' into 'dev'</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 5v3l2.2 2.2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Rebase 'dev' onto 'origin/stage'</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 1 1.6 3.7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M3 5v3h3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Reset</span><span class="chev">▸</span></button>
    <button class="ctx-item"><span class="ic"></span><span class="lbl">Cherry-Pick</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5 5 13a1 1 0 0 0 1 .9h4a1 1 0 0 0 1-.9l.5-8.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Delete</span><span class="shortcut">Del</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 5.5v3l2 1.3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">View History</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M5.5 3v9M10.5 4v9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 5.5 5.5 3l2 2.5M8.5 10.5l2 2.5 2-2.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Compare 'origin/stage' with 'dev'...</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/></svg><span class="lbl">Toggle Branch in History</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="lbl">Fetch</span></button>
    <button class="ctx-item" disabled><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 5.2v5.6M5.6 8l2.4 2.4L10.4 8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Pull</span></button>
    <button class="ctx-item" disabled><svg class="ic" viewBox="0 0 16 16"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Push</span></button>
    <button class="ctx-item" disabled><svg class="ic" viewBox="0 0 16 16"><path d="M12.5 5.5A5 5 0 0 0 4 3.8M3.5 3v3h3M3.5 10.5A5 5 0 0 0 12 12.2M12.5 13v-3h-3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Sync (Pull then Push)</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12.5" r="1.4" fill="currentColor"/><circle cx="11.5" cy="8" r="1.4" fill="currentColor"/><path d="M4.5 5V11M6 8h4.2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M8.6 6 10.8 8 8.6 10" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">New Pull Request</span></button>
    <button class="ctx-item"><svg class="ic" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5.5 13.5h8v-8" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg><span class="lbl">New Worktree From...</span></button>
  </div>
</div>
<style>
  .ds-root{font-family:var(--font-sans);position:relative;height:440px;background:var(--surface-200);padding:var(--space-4)}
  .row-context{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;color:var(--ink);width:220px}
  .row-context .ic.remote{color:var(--brand)}
  .row-context .txt{font-size:13px;font-weight:600}
  .ctxmenu{position:absolute;top:52px;left:16px;min-width:270px;background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:4px 0;font-size:13px}
  .ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:6px 12px;background:none;border:none;color:var(--ink);text-align:left;cursor:pointer}
  .ctx-item .ic{width:16px;height:16px;flex:none;color:var(--ink-secondary)}
  .ctx-item:hover:not(:disabled){background:var(--accent-selected-bg);color:var(--ink-inverse)}
  .ctx-item:hover:not(:disabled) .ic{color:var(--ink-inverse)}
  .ctx-item:disabled{color:var(--ink-disabled);cursor:default}
  .ctx-item:disabled .ic{color:var(--ink-disabled)}
  .ctx-item .lbl{flex:1;white-space:nowrap}
  .ctx-item .shortcut,.ctx-item .chev{color:var(--ink-secondary);font-size:12px;flex:none}
  .ctx-item:hover:not(:disabled) .shortcut,.ctx-item:hover:not(:disabled) .chev{color:var(--ink-inverse)}
  .ctx-divider{height:1px;background:var(--border-subtle);margin:4px 0}
</style>
