<!-- @dsCard group="Panels" height=560 subtitle="Sidebar — Branches / Tags" -->
<div class="ds-root">
  <div class="panel">
    <div class="search">
      <svg viewBox="0 0 16 16"><circle cx="6.75" cy="6.75" r="4.25" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input placeholder="Filter" />
    </div>

    <div class="section">
      <div class="section-head"><svg class="chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Branches / Tags</span></div>

      <div class="row depth0 current">
        <svg class="ic checkout" viewBox="0 0 16 16"><path d="M8 2l2 6-2 6-2-6z" fill="currentColor"/></svg>
        <span class="txt strong">gitdesk (main)</span>
      </div>

      <div class="row depth1 folder">
        <svg class="chev sm" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5h4l1.2 1.5H14v6.5H2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        <span class="txt">feature</span>
      </div>
      <div class="row depth2">
        <svg class="ic branch" viewBox="0 0 16 16"><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><path d="M5 5.6V10.4M6.3 8A3.2 3.2 0 0 0 9.4 9.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span class="txt">feature/oauth-login</span>
        <span class="spacer"></span>
        <span class="pill ahead">↑2</span>
      </div>

      <div class="row depth1">
        <svg class="ic branch" viewBox="0 0 16 16"><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><path d="M5 5.6V10.4M6.3 8A3.2 3.2 0 0 0 9.4 9.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span class="txt">develop</span>
        <span class="spacer"></span>
        <span class="pill behind">↓1</span>
      </div>

      <div class="row depth1 selected">
        <svg class="ic branch current-glyph" viewBox="0 0 16 16"><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><path d="M5 5.6V10.4M6.3 8A3.2 3.2 0 0 0 9.4 9.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span class="txt strong">main</span>
        <svg class="check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="row depth1 folder">
        <svg class="chev sm open" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5h4l1.2 1.5H14v6.5H2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        <span class="txt">remotes/origin</span>
      </div>
      <div class="row depth2">
        <svg class="ic remote" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="txt">main</span>
      </div>
      <div class="row depth2">
        <svg class="ic remote" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="txt">develop</span>
      </div>
      <div class="row depth2 folder">
        <svg class="chev sm" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5h4l1.2 1.5H14v6.5H2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        <span class="txt">release</span>
      </div>
      <div class="row depth2 folder">
        <svg class="chev sm" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5h4l1.2 1.5H14v6.5H2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        <span class="txt">hotfix</span>
      </div>

      <div class="row depth1">
        <svg class="ic tag" viewBox="0 0 16 16"><path d="M2 2h5.5L14 8.5 7.5 15 2 9.5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/><circle cx="5" cy="5" r="1" fill="currentColor"/></svg>
        <span class="txt">v2.3.0</span>
      </div>
      <div class="row depth1">
        <svg class="ic tag" viewBox="0 0 16 16"><path d="M2 2h5.5L14 8.5 7.5 15 2 9.5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/><circle cx="5" cy="5" r="1" fill="currentColor"/></svg>
        <span class="txt">v2.2.1</span>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><svg class="chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Pull Requests</span></div>
      <div class="empty">There are currently no pull requests.</div>
    </div>

    <div class="section">
      <div class="section-head">
        <svg class="chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Submodules</span>
        <span class="spacer"></span>
        <button class="add" title="Add submodule"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</div>
<style>
  .ds-root{font-family:var(--font-sans);height:540px;display:flex}
  .panel{width:300px;background:var(--surface-200);display:flex;flex-direction:column;overflow:hidden}
  .search{display:flex;align-items:center;gap:var(--space-2);height:28px;margin:var(--space-3);background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:0 var(--space-3);color:var(--ink-secondary)}
  .search svg{width:13px;height:13px;flex:none}
  .search input{border:none;background:transparent;font-family:var(--font-sans);font-size:12px;color:var(--ink);flex:1;outline:none}
  .section{border-top:1px solid var(--border-subtle);padding-top:var(--space-2)}
  .section-head{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);cursor:pointer}
  .section-head .chev{width:14px;height:14px;color:var(--ink-secondary);transform:rotate(90deg)}
  .section-head .label{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-secondary)}
  .add{width:20px;height:20px;border:none;background:transparent;color:var(--ink-secondary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .add:hover{background:var(--surface-hover);color:var(--ink)}
  .add svg{width:12px;height:12px}
  .empty{padding:var(--space-2) var(--space-4) var(--space-4);font-size:12px;color:var(--ink-secondary)}
  .row{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);cursor:pointer}
  .row:hover{background:var(--surface-hover)}
  .row.selected{background:var(--accent-selected-bg)}
  .row.selected .txt{color:var(--ink-inverse)}
  .row.selected .check{color:var(--ink-inverse)}
  .row .check{width:13px;height:13px;margin-left:auto;color:var(--brand);flex:none}
  .row.depth0{padding-left:var(--space-4)}
  .row.depth1{padding-left:28px}
  .row.depth2{padding-left:44px}
  .row.folder{padding-left:16px}
  .row.depth1.folder{padding-left:16px}
  .row.depth2.folder{padding-left:32px}
  .chev.sm{width:12px;height:12px;color:var(--ink-secondary);flex:none;transform:rotate(0deg)}
  .chev.sm.open{transform:rotate(90deg)}
  .ic{width:16px;height:16px;flex:none;color:var(--ink-secondary)}
  .ic.checkout{color:var(--brand)}
  .ic.branch{color:var(--status-added)}
  .ic.current-glyph{color:var(--brand)}
  .row.selected .ic.current-glyph{color:var(--ink-inverse)}
  .ic.remote{color:var(--brand)}
  .row.selected .ic.remote{color:var(--ink-inverse)}
  .ic.tag{color:var(--status-warning)}
  .txt{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .txt.strong{font-weight:600}
  .row.current .txt{font-weight:600;color:var(--ink)}
  .spacer{flex:1}
  .pill{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:var(--radius-full);background:var(--surface-hover)}
  .pill.ahead{color:var(--status-added)}
  .pill.behind{color:var(--status-deleted)}
</style>
