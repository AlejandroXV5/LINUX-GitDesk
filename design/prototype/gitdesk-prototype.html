<title>GitDesk</title>
<meta name="description" content="Prototipo interactivo de GitDesk, un cliente Git para Linux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --surface-100:#ffffff; --surface-200:#f3f3f3; --surface-300:#ffffff; --surface-hover:#e8e8e8;
  --surface-selected:#e4e6f1; --accent-selected-bg:#0060c0;
  --border-subtle:#e0e0e0; --border-control:#8a8a8a;
  --ink:#242424; --ink-secondary:#6b6b6b; --ink-disabled:#a0a0a0; --ink-inverse:#ffffff;
  --brand:#005fb8; --brand-solid:#0067b8; --brand-solid-hover:#005aa1;
  --status-added:#2f7d32; --status-modified:#9b6a1f; --status-deleted:#c72e2e; --status-renamed:#8250b8; --status-warning:#9a7b00;
  --graph-1:#9b6a1f; --graph-2:#0067b8; --graph-3:#2f7d32; --graph-4:#8250b8; --graph-5:#1a8f7b;
  --identity-1:#8a5a2b; --identity-2:#2f6fb0; --identity-3:#3f7d3f; --identity-4:#7a4fa0; --identity-5:#1f8f82;
  --focus-ring:#005fb8;
  --space-1:2px; --space-2:4px; --space-3:8px; --space-4:12px; --space-5:16px; --space-6:24px;
  --radius-sm:2px; --radius-md:4px; --radius-full:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.16); --shadow-md:0 6px 20px rgba(0,0,0,0.22);
  --font-sans:"Cantarell","Ubuntu","Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Code","DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface-100:#1e1e1e; --surface-200:#252526; --surface-300:#2d2d2d; --surface-hover:#2f3233;
    --surface-selected:#37373d; --accent-selected-bg:#0a4d78;
    --border-subtle:#3c3c3c; --border-control:#6e6e6e;
    --ink:#cccccc; --ink-secondary:#9d9d9d; --ink-disabled:#656565; --ink-inverse:#ffffff;
    --brand:#3fa8ff; --brand-solid:#0e639c; --brand-solid-hover:#1177bb;
    --status-added:#89d185; --status-modified:#d19a66; --status-deleted:#f14c4c; --status-renamed:#b180d7; --status-warning:#cca700;
    --graph-1:#d19a66; --graph-2:#4fc1ff; --graph-3:#89d185; --graph-4:#b180d7; --graph-5:#4ec9b0;
    --focus-ring:#3fa8ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.34); --shadow-md:0 6px 20px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --surface-100:#1e1e1e; --surface-200:#252526; --surface-300:#2d2d2d; --surface-hover:#2f3233;
  --surface-selected:#37373d; --accent-selected-bg:#0a4d78;
  --border-subtle:#3c3c3c; --border-control:#6e6e6e;
  --ink:#cccccc; --ink-secondary:#9d9d9d; --ink-disabled:#656565; --ink-inverse:#ffffff;
  --brand:#3fa8ff; --brand-solid:#0e639c; --brand-solid-hover:#1177bb;
  --status-added:#89d185; --status-modified:#d19a66; --status-deleted:#f14c4c; --status-renamed:#b180d7; --status-warning:#cca700;
  --graph-1:#d19a66; --graph-2:#4fc1ff; --graph-3:#89d185; --graph-4:#b180d7; --graph-5:#4ec9b0;
  --focus-ring:#3fa8ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.34); --shadow-md:0 6px 20px rgba(0,0,0,0.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);font-size:13px;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.ic{width:16px;height:16px;flex:none;display:block}
.mono{font-family:var(--font-mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;display:flex;flex-direction:column;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}

/* title bar */
.titlebar{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-200);border-bottom:1px solid var(--border-subtle);padding:0 6px 0 12px}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-left .ic{color:var(--brand)}
.win-title{font-size:12px;font-weight:600;color:var(--ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:2px;flex:none}
.wbtn{height:28px;min-width:30px;border:none;background:transparent;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink-secondary);padding:0 6px}
.wbtn .ic{width:13px;height:13px}
.wbtn:hover{background:var(--surface-hover);color:var(--ink)}
.wbtn.close:hover{background:var(--status-deleted);color:var(--ink-inverse)}
.wbtn.pill{font-size:11px;font-weight:600;letter-spacing:.03em}

/* menu bar */
.menubar{flex:none;height:30px;display:flex;align-items:center;gap:1px;background:var(--surface-200);border-bottom:1px solid var(--border-subtle);padding:0 6px;overflow-x:auto;scrollbar-width:none}
.menubar .mb{border:none;background:transparent;padding:4px 10px;border-radius:var(--radius-sm);white-space:nowrap}
.menubar .mb:hover,.menubar .mb[aria-expanded="true"]{background:var(--surface-hover)}

/* toolbar */
.toolbar{flex:none;height:40px;display:flex;align-items:center;gap:2px;background:var(--surface-200);border-bottom:1px solid var(--border-subtle);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.t-btn{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;background:transparent;border:none;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap;flex:none}
.t-btn:hover:not(:disabled){background:var(--surface-hover)}
.t-btn:disabled{color:var(--ink-disabled)}
.t-btn[aria-pressed="true"]{background:var(--surface-selected)}
.t-btn.icon-only{padding:0 7px}
.count{background:var(--status-modified);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:var(--radius-full);line-height:15px}
.count[hidden]{display:none}
.t-sep{width:1px;height:20px;background:var(--border-subtle);margin:0 4px;flex:none}
.t-spacer{flex:1;min-width:8px}
.hamburger{display:none}
.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.icon-btn{width:24px;height:24px;border:none;background:transparent;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-secondary);flex:none;padding:0}
.icon-btn:hover:not(:disabled){background:var(--surface-hover);color:var(--ink)}
.icon-btn:disabled{color:var(--ink-disabled)}
.icon-btn[aria-pressed="true"]{background:var(--surface-selected);color:var(--brand)}
.icon-btn .ic{width:14px;height:14px}
.link{border:none;background:none;padding:0;color:var(--brand);font-size:12px}
.link:hover{text-decoration:underline}
.link:disabled{color:var(--ink-disabled);text-decoration:none}

/* workspace */
.workspace{flex:1;display:flex;min-height:0;position:relative}
.leftcol{flex:1;display:flex;flex-direction:column;min-width:0}
.toprow{flex:1;display:flex;min-height:0}
.sidebar{width:272px;flex:none;background:var(--surface-200);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0}
.graph-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface-100)}
.output{height:150px;flex:none;border-top:1px solid var(--border-subtle);background:var(--surface-200);display:flex;flex-direction:column}
.dock{width:372px;flex:none;background:var(--surface-200);border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;position:relative}
@media (min-width:761px){
  .app.no-sidebar .sidebar{display:none}
  .app.no-dock .dock{display:none}
  .app.no-output .output{display:none}
}
.backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:19}

.filterbox{display:flex;align-items:center;gap:6px;height:26px;background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:0 8px;color:var(--ink-secondary)}
.filterbox .ic{width:13px;height:13px}
.filterbox input{border:none;background:transparent;font-size:12px;color:var(--ink);flex:1;outline:none;min-width:0}
.filterbox:focus-within{border-color:var(--focus-ring)}
.sidebar .filterbox{margin:8px}

/* tree */
.tree{flex:1;overflow-y:auto;padding-bottom:12px}
.tsec-h{display:flex;align-items:center;gap:4px;padding:6px 8px 4px 8px;border-top:1px solid var(--border-subtle);margin-top:4px}
.tsec-h:first-child{border-top:none;margin-top:0}
.tsec-h .tog{display:flex;align-items:center;gap:4px;border:none;background:none;padding:0;flex:1;text-align:left;font-weight:600;font-size:12px}
.tsec-h .chev{width:12px;height:12px;color:var(--ink-secondary);transition:transform .12s}
.tsec-h.open .chev{transform:rotate(90deg)}
.trow{display:flex;align-items:center;gap:5px;height:24px;padding-right:8px;cursor:default;user-select:none;white-space:nowrap}
.trow:hover{background:var(--surface-hover)}
.trow.selected{background:var(--surface-selected)}
.tree:focus-within .trow.selected{background:var(--accent-selected-bg);color:var(--ink-inverse)}
.tree:focus-within .trow.selected .ic,.tree:focus-within .trow.selected .pill{color:var(--ink-inverse)}
.tree:focus-within .trow.selected .pill{background:rgba(255,255,255,.2)}
.trow .fchev{width:12px;height:12px;color:var(--ink-secondary);flex:none;transition:transform .12s}
.trow.open .fchev{transform:rotate(90deg)}
.trow .tw{width:12px;flex:none}
.trow .lbl{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.trow.current .lbl{font-weight:700}
.trow .ic{color:var(--ink-secondary)}
.trow .ic.local{color:var(--status-added)}
.trow .ic.cur{color:var(--brand)}
.trow .ic.remote{color:var(--brand)}
.trow .ic.tag{color:var(--status-warning)}
.trow .ic.eye{width:13px;height:13px;color:var(--ink-secondary)}
.pill{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:0 5px;border-radius:var(--radius-full);background:var(--surface-hover);line-height:16px;flex:none}
.pill.ahead{color:var(--status-added)}
.pill.behind{color:var(--status-deleted)}
.pill.gone{color:var(--ink-secondary)}
.tempty{padding:4px 12px 8px 28px;font-size:12px;color:var(--ink-secondary)}
.prrow{display:flex;flex-direction:column;gap:1px;padding:4px 10px 4px 28px;cursor:pointer}
.prrow:hover{background:var(--surface-hover)}
.prrow .t1{display:flex;gap:6px;align-items:center}
.prrow .t2{font-size:11.5px;color:var(--ink-secondary)}
.st-badge{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:var(--radius-full);border:1px solid currentColor;line-height:15px}
.st-open{color:var(--status-added)} .st-draft{color:var(--ink-secondary)} .st-completed{color:var(--status-renamed)} .st-abandoned{color:var(--status-deleted)}
.subrow{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 28px}
.subrow:hover{background:var(--surface-hover)}
.subrow .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .icon-btn{visibility:hidden}
.subrow:hover .icon-btn{visibility:visible}
</style>
<style>
/* graph pane */
.gtoolbar{flex:none;display:flex;align-items:center;gap:2px;height:34px;padding:0 8px;border-bottom:1px solid var(--border-subtle);background:var(--surface-200)}
.gtoolbar .filterbox{width:220px}
.gref{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 2px;font-size:12px;color:var(--ink-secondary)}
.gref .link{font-size:12px;display:inline-flex;align-items:center;gap:3px}
.gsec{flex:none;display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;font-size:12px}
.gsec .tog{display:flex;align-items:center;gap:4px;border:none;background:none;padding:0;font-weight:600;font-size:12px}
.gsec .chev{width:12px;height:12px;color:var(--ink-secondary);transition:transform .12s}
.gsec.open .chev{transform:rotate(90deg)}
.gsec .sp{flex:1}
.gsec .sep-dot{color:var(--ink-disabled)}
.inc-list{flex:none;max-height:120px;overflow-y:auto;border-bottom:1px solid var(--border-subtle)}
.inc-empty{padding:2px 12px 8px 30px;font-size:12px;color:var(--ink-secondary)}
.graph-pane{container-type:inline-size}
.gridrow{display:grid;grid-template-columns:128px var(--gw,40px) minmax(0,1fr) 124px 112px 72px;column-gap:10px;align-items:center;padding:0 12px}
@container (max-width:760px){ .gridrow{grid-template-columns:118px var(--gw,40px) minmax(0,1fr) 118px 72px} .c-date{display:none!important} }
@container (max-width:600px){ .gridrow{grid-template-columns:100px var(--gw,40px) minmax(0,1fr) 68px} .c-author{display:none!important} }
@container (max-width:440px){ .gridrow{grid-template-columns:var(--gw,40px) minmax(0,1fr) 64px} .c-ref{display:none!important} }
.thead{flex:none;height:26px;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--ink-secondary);background:var(--surface-100)}
.graph-scroll{flex:1;overflow:auto;min-height:0;outline:none}
.crow{height:26px;cursor:default;white-space:nowrap}
.crow:hover{background:var(--surface-hover)}
.crow.selected{background:var(--surface-selected)}
.graph-scroll:focus .crow.selected,.graph-scroll:focus-within .crow.selected{background:var(--accent-selected-bg);color:var(--ink-inverse)}
.graph-scroll:focus .crow.selected .c-author,.graph-scroll:focus .crow.selected .c-date,.graph-scroll:focus .crow.selected .c-id{color:var(--ink-inverse)}
.crow > span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-graph{height:26px}
.c-graph svg{display:block}
.c-author{display:flex;align-items:center;gap:6px;color:var(--ink-secondary);font-size:12px}
.c-date,.c-id{color:var(--ink-secondary);font-size:12px}
.c-id{font-family:var(--font-mono);font-size:11.5px}
.c-msg{display:flex!important;align-items:center;gap:6px}
.c-msg .m{overflow:hidden;text-overflow:ellipsis}
.c-msg .out{width:12px;height:12px;color:var(--brand)}
.c-ref{display:flex!important;gap:3px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:0 6px;height:18px;border-radius:var(--radius-sm);background:var(--surface-hover);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.chip.head{background:var(--brand-solid);color:#fff}
.chip.remote{background:transparent;border:1px solid var(--brand);color:var(--brand)}
.chip.tag{background:transparent;border:1px solid var(--status-warning);color:var(--status-warning)}
.chip.more{flex:none;background:transparent;color:var(--ink-secondary);padding:0 2px}
.avatar{width:17px;height:17px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex:none}
.av1{background:var(--identity-1)} .av2{background:var(--identity-2)} .av3{background:var(--identity-3)} .av4{background:var(--identity-4)} .av5{background:var(--identity-5)}
.g-empty{padding:16px 12px;color:var(--ink-secondary);font-size:12px}

.detail{flex:none;max-height:42%;overflow-y:auto;border-top:1px solid var(--border-subtle);background:var(--surface-200);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.detail[hidden]{display:none}
.detail-h{display:flex;align-items:flex-start;gap:8px}
.detail-h strong{flex:1;font-size:13px}
.detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--ink-secondary)}
.detail-meta .mono{color:var(--ink)}
.detail-body{margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary)}
.sub-h{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-secondary)}

/* output */
.out-head{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 12px;border-bottom:1px solid var(--border-subtle);font-size:12px}
.out-head strong{font-weight:600}
.out-head select{background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);font-size:12px;padding:2px 4px;color:var(--ink)}
.out-body{flex:1;overflow-y:auto;padding:4px 12px 8px;font-family:var(--font-mono);font-size:11.5px;line-height:17px}
.ol{white-space:pre-wrap;word-break:break-word}
.ol .ts{color:var(--ink-disabled)}
.ol.cmd{color:var(--brand)}
.ol.err{color:var(--status-deleted)}
.ol.ok{color:var(--status-added)}

/* dock */
.dock-head{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-bottom:1px solid var(--border-subtle);font-size:12px}
.dock-head .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{position:absolute;left:0;right:0;top:30px;height:2px;overflow:hidden}
.progress::after{content:"";position:absolute;inset:0;width:30%;background:var(--brand);animation:prog 1s ease-in-out infinite}
.progress[hidden]{display:none}
@keyframes prog{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.dock-bar{flex:none;display:flex;align-items:center;gap:2px;padding:8px 8px 4px 12px}
.selectbox{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:26px;background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:0 6px 0 8px;text-align:left}
.selectbox .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selectbox .ic{width:13px;height:13px;color:var(--ink-secondary)}
.dock-counts{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px 6px;font-size:12px;color:var(--ink-secondary)}
.dock-counts .ic{width:13px;height:13px}
.dock-counts .ab{display:flex;align-items:center;gap:4px;border:none;background:none;padding:0;color:var(--ink-secondary)}
.dock-counts .ab:hover{color:var(--ink)}
.notice{margin:0 12px 8px;display:flex;align-items:flex-start;gap:8px;padding:8px 8px 8px 10px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);background:var(--surface-300);font-size:12px;line-height:17px}
.notice .ic{margin-top:1px;width:14px;height:14px}
.notice.ok .ic{color:var(--status-added)} .notice.info .ic{color:var(--brand)} .notice.warn .ic{color:var(--status-warning)} .notice.error .ic{color:var(--status-deleted)}
.notice.error{border-color:var(--status-deleted)}
.notice .txt{flex:1}
.notice .acts{display:inline-flex;gap:10px;margin-left:6px}
.compose{flex:none;padding:0 12px 10px;display:flex;flex-direction:column;gap:8px}
.msgwrap{position:relative}
.msgwrap textarea{width:100%;display:block;font-size:13px;line-height:18px;color:var(--ink);background:var(--surface-300);border:1px solid var(--border-control);border-radius:var(--radius-sm);padding:7px 30px 7px 8px;min-height:62px;max-height:180px;resize:vertical}
.msgwrap textarea::placeholder{color:var(--ink-secondary)}
.msgwrap textarea:focus{outline:2px solid var(--focus-ring);outline-offset:-1px}
.msgwrap textarea.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hashbtn{position:absolute;right:4px;bottom:4px;font-weight:700;font-size:13px}
.compose-actions{display:flex;align-items:center;gap:12px}
.split{display:inline-flex}
.btn{font-size:13px;height:26px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand-solid);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--brand-solid-hover)}
.btn-primary:disabled{background:var(--surface-hover);color:var(--ink-disabled)}
.btn-secondary{background:transparent;border-color:var(--border-control);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-danger{background:transparent;border-color:var(--status-deleted);color:var(--status-deleted)}
.btn-danger:hover{background:var(--surface-hover)}
.split .btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.split .split-arrow{padding:0 5px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:1px solid rgba(255,255,255,.25)}
.split .split-arrow .ic{width:12px;height:12px}
.cb{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:15px;height:15px;border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--surface-300);display:flex;align-items:center;justify-content:center;flex:none}
.box .ic{width:11px;height:11px;color:#fff;opacity:0}
.cb input:checked + .box{background:var(--brand-solid);border-color:var(--brand-solid)}
.cb input:checked + .box .ic{opacity:1}

function blankRepo(name){

function addCommit(msg, author, parents, files, tm){

}

}
const headSha = () => R.head.branch ? R.branches[R.head.branch].tip : R.head.detached;
const curBranch = () => R.head.branch || null;
function setTip(s){ if (R.head.branch) R.branches[R.head.branch].tip = s; else R.head.detached = s; }
function resolve(ref){

  if (R.tags[ref]) return R.tags[ref];

}

function incomingList(){ const b = curBranch(); if (!b) return []; const br = R.branches[b]; if (!br.upstream || !R.remotes[br.upstream]) return []; return onlyIn(R.remotes[br.upstream], br.tip); }

function scopeOf(msg){ const m = /^\w+\(([^)]+)\)/.exec(msg); return m ? m[1] : 'core'; }

  const sc = scopeOf(c.msg).replace(/[^a-z0-9-]/gi, '');
  const n = parseInt(c.sha.slice(0, 2), 16);
  const list = [{ st: 'M', path: `src/${sc}/${sc}_service.py` }];
  if (n % 3 !== 0) list.push({ st: n % 2 ? 'A' : 'M', path: `tests/${sc}/test_${sc}.py` });

}
const dirOf = p => p.indexOf('/') >= 0 ? p.slice(0, p.lastIndexOf('/')) : '';
const baseOf = p => p.slice(p.lastIndexOf('/') + 1);

function fmtDate(tm){
  if (S.dateFmt === 'absolute') return new Date(tm).toLocaleString(locale(), { dateStyle: 'short', timeStyle: 'short' });
  const rtf = new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' });
  const d = (tm - Date.now()) / 1000, a = Math.abs(d);
  if (a < 45) return rtf.format(0, 'second');
  if (a < 3600) return rtf.format(Math.round(d / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(d / 3600), 'hour');
  if (a < 86400 * 7) return rtf.format(Math.round(d / 86400), 'day');
  if (a < 86400 * 30) return rtf.format(Math.round(d / 604800), 'week');

  (lines || []).forEach(l => OUT.push({ ch: ch || 'git', tm, text: typeof l === 'string' ? l : l.text, kind: typeof l === 'string' ? '' : l.kind }));

// ---------- toast ----------
let toastTimer;
function toast(msg, action){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="link">${esc(action.label)}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('show'); action.fn(); };
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}
const isNarrow = () => window.innerWidth <= 760;
function dockVisible(){ return isNarrow() ? $('#app').classList.contains('drawer-dock') : S.showDock; }
// notice: shown in the Git Changes dock (like Visual Studio's info bar); falls back to a toast if the dock is hidden
function notice(type, text, actions){
  R.notice = { type, text, actions: actions || [] };
  if (!dockVisible()) toast(text, (actions && actions[0]) || null);
}

// ---------- busy / run ----------
let busy = null;
async function run(key, fn){
  if (busy) return;
  busy = key; renderBusy();
  await sleep(380 + Math.floor(Math.random() * 420));
  try { fn(); } catch (err){ console.error(err); notice('error', String(err && err.message || err)); }
  busy = null; renderAll();
}

// ---------- menus ----------
let menuAnchor = null;
function closeMenus(){

  menuAnchor = null;

function place(el, x, y, alignRight){
  el.style.left = '0px'; el.style.top = '0px';
  const wd = el.offsetWidth, ht = el.offsetHeight;
  let vx = alignRight ? x - wd : x;
  vx = Math.max(8, Math.min(vx, window.innerWidth - wd - 8));
  let vy = y;
  if (vy + ht > window.innerHeight - 8) vy = Math.max(8, window.innerHeight - ht - 8);
  el.style.left = vx + 'px'; el.style.top = vy + 'px';
}
function buildMenu(items){
  const el = document.createElement('div');
  el.className = 'menu'; el.setAttribute('role', 'menu');
  items.forEach(it => {
    if (!it) return;
    if (it.divider){ el.insertAdjacentHTML('beforeend', '<div class="menu-sep" role="separator"></div>'); return; }
    if (it.header){ el.insertAdjacentHTML('beforeend', `<div class="menu-h">${esc(it.header)}</div>`); return; }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mi'; b.setAttribute('role', 'menuitem'); b.disabled = !!it.disabled;
    b.innerHTML = `<span class="mi-ic">${it.checked ? svg('check') : it.icon ? svg(it.icon) : ''}</span><span class="mi-label">${esc(it.label)}</span>` +
      (it.shortcut ? `<span class="mi-sc">${esc(it.shortcut)}</span>` : '') + (it.submenu ? `<span class="mi-sc">▸</span>` : '');
    if (it.submenu){
      const open = () => openSub(b, el, it.submenu);
      b.addEventListener('mouseenter', open);
      b.addEventListener('click', e => { e.stopPropagation(); open(); const f = el._sub && el._sub.querySelector('.mi:not(:disabled)'); f && f.focus(); });
      b._openSub = open;
    } else {
      b.addEventListener('mouseenter', () => closeSub(el));
      b.addEventListener('click', e => { e.stopPropagation(); closeMenus(); if (it.action) it.action(); });
    }
    el.appendChild(b);
  });
  return el;
}
function openSub(btn, parent, items){
  if (parent._sub && parent._sub._from === btn) return;
  closeSub(parent);
  const sub = buildMenu(items); sub._from = btn; sub._parent = parent;
  document.body.appendChild(sub); parent._sub = sub; btn.classList.add('sub-open');
  const r = btn.getBoundingClientRect();
  place(sub, r.right - 2, r.top - 4);
  if (sub.getBoundingClientRect().left < r.right - 10) place(sub, r.left - sub.offsetWidth + 2, r.top - 4);
}
function closeSub(menu){ if (menu._sub){ closeSub(menu._sub); menu._sub._from.classList.remove('sub-open'); menu._sub.remove(); menu._sub = null; } }
function showMenu(items, x, y, anchor, alignRight){
  closeMenus();
  const el = buildMenu(items); document.body.appendChild(el);
  place(el, x, y, alignRight); menuAnchor = anchor || null;
  return el;
}
function menuAt(anchor, items, alignRight){
  if (menuAnchor === anchor){ closeMenus(); return; }
  const r = anchor.getBoundingClientRect();
  const el = showMenu(items, alignRight ? r.right : r.left, r.bottom + 2, anchor, alignRight);
  if (r.bottom + el.offsetHeight > window.innerHeight - 8) place(el, alignRight ? r.right : r.left, r.top - el.offsetHeight - 2, alignRight);
  menuAnchor = anchor;

    const b = document.createElement('button');

// ---------- clipboard ----------
function copyText(s){

  try { navigator.clipboard.writeText(s).then(done, fallback); } catch (e){ fallback(); }
  function fallback(){ const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e){} ta.remove(); done(); }
}

// ---------- actions (everything a button, menu or shortcut can trigger) ----------

  commit: mode => {

function tree(items, depth, keyPrefix, rowFn){
  const folders = {}, leaves = [];
  items.forEach(it => { const i = it.rel.indexOf('/'); if (i > 0){ const f = it.rel.slice(0, i); (folders[f] = folders[f] || []).push({ rel: it.rel.slice(i + 1), full: it.full, path: (it.path ? it.path + '/' : '') + f }); } else leaves.push(Object.assign({}, it, { depth })); });
  const q = $('#branchFilter').value.trim();
  let h = '';
  Object.keys(folders).sort().forEach(f => {
    const key = keyPrefix + ((folders[f][0].path) || f);
    const open = !!q || R.openFolders.has(key);
    h += folderRow(f, key, depth, open, false);
    if (open) h += tree(folders[f], depth + 1, keyPrefix, rowFn);
  });
  leaves.forEach(it => { h += rowFn(it); });
  return h;
}
function folderRow(label, key, depth, open, remoteIcon){
  return `<div class="trow folder${open ? ' open' : ''}" data-folder="${esc(key)}" style="padding-left:${depth * 16}px" role="treeitem" aria-expanded="${open}">${svg('chev', 'fchev')}${svg(remoteIcon ? 'remote' : 'folder', remoteIcon ? 'remote' : '')}<span class="lbl">${esc(label)}</span></div>`;
}
function refRow(full, label, kind, depth){
  const isCur = kind === 'local' && R.head.branch === full;
  const tr = kind === 'local' ? tracking(full) : null;
  const gone = kind === 'local' && R.branches[full].upstream && !R.remotes[R.branches[full].upstream];
  const icon = kind === 'local' ? svg('branch', isCur ? 'cur' : 'local') : kind === 'remote' ? svg('remote', 'remote') : svg('tag', 'tag');
  let tail = '';
  if (R.extra.has(full)) tail += svg('eye', 'eye');
  if (tr && tr.ahead) tail += `<span class="pill ahead" title="${tr.ahead} outgoing">↑${tr.ahead}</span>`;
  if (tr && tr.behind) tail += `<span class="pill behind" title="${tr.behind} incoming">↓${tr.behind}</span>`;
  if (gone) tail += `<span class="pill gone">gone</span>`;
  if (isCur) tail += svg('check', 'cur');
  return `<div class="trow${isCur ? ' current' : ''}${R.selRef === full ? ' selected' : ''}" data-ref="${esc(full)}" data-kind="${kind}" tabindex="-1" role="treeitem" style="padding-left:${depth * 16}px"><span class="tw"></span>${icon}<span class="lbl" title="${esc(full)}">${esc(label)}</span>${tail}</div>`;
}

// ----- commit graph -----
function viewTips(){
  const tips = [];
  if (R.showAll){
    Object.values(R.branches).forEach(b => tips.push(b.tip));
    Object.values(R.remotes).forEach(s => tips.push(s));
    if (R.showTags) Object.values(R.tags).forEach(s => tips.push(s));
    if (R.head.detached) tips.push(R.head.detached);
  } else {
    const main = R.historyRef ? resolve(R.historyRef) : headSha();
    if (main) tips.push(main);
    R.extra.forEach(r => { const s = resolve(r); if (s) tips.push(s); });
  }
  return tips;
}
function layout(rows){
  let lanes = []; const out = [];
  rows.forEach(c => {
    const before = lanes.slice();
    let col = before.indexOf(c.sha);
    if (col < 0){ col = before.indexOf(null); if (col < 0) col = before.length; }
    const after = before.slice();
    before.forEach((s, i) => { if (s === c.sha) after[i] = null; });
    while (after.length <= col) after.push(null);
    const pcols = [];
    c.parents.forEach((p, pi) => {
      const ex = after.indexOf(p);
      if (ex >= 0){ pcols.push(ex); return; }
      if (pi === 0 && after[col] === null){ after[col] = p; pcols.push(col); return; }
      let f = after.indexOf(null); if (f < 0){ f = after.length; after.push(null); }
      after[f] = p; pcols.push(f);
    });
    while (after.length && after[after.length - 1] === null) after.pop();
    out.push({ c, col, before, after, pcols });
    lanes = after;
  });
  return out;
}
const LX = i => 9 + i * 12;
const laneColor = i => `var(--graph-${i % 5 + 1})`;
function rowSvg(L, gw, headS, isMerge){
  const H = 26, M = 13; let p = '';
  const curve = (x1, y1, x2, y2, col) => x1 === x2 ? `<path d="M${x1} ${y1}V${y2}" style="stroke:${laneColor(col)}" stroke-width="1.8" fill="none"/>` : `<path d="M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}" style="stroke:${laneColor(col)}" stroke-width="1.8" fill="none"/>`;
  L.before.forEach((s, i) => {
    if (s === null || s === undefined) return;
    if (s === L.c.sha) p += curve(LX(i), 0, LX(L.col), M, i);
    else p += curve(LX(i), 0, LX(i), H, i);
  });
  L.pcols.forEach(pc => { p += curve(LX(L.col), M, LX(pc), H, pc); });
  const x = LX(L.col), col = laneColor(L.col);
  if (L.c.sha === headS) p += `<circle cx="${x}" cy="${M}" r="5" style="fill:${col};stroke:var(--brand)" stroke-width="2"/>`;
  else if (isMerge) p += `<circle cx="${x}" cy="${M}" r="3.8" style="fill:var(--surface-100);stroke:${col}" stroke-width="2"/>`;
  else p += `<circle cx="${x}" cy="${M}" r="3.8" style="fill:${col}"/>`;
  return `<svg width="${gw}" height="${H}" viewBox="0 0 ${gw} ${H}" aria-hidden="true">${p}</svg>`;
}
function refsByCommit(){
  const m = {};
  const add = (s, o) => { (m[s] = m[s] || []).push(o); };
  Object.keys(R.branches).forEach(b => add(R.branches[b].tip, { name: b, cls: R.head.branch === b ? 'head' : '' }));
  Object.keys(R.remotes).forEach(k => add(R.remotes[k], { name: k, cls: 'remote' }));
  if (R.showTags) Object.keys(R.tags).forEach(k => add(R.tags[k], { name: k, cls: 'tag' }));
  if (R.head.detached) add(R.head.detached, { name: 'HEAD', cls: 'head' });
  Object.values(m).forEach(a => a.sort((x, y) => (y.cls === 'head') - (x.cls === 'head')));
  return m;
}
function chipsHtml(refs){
  if (!refs || !refs.length) return '';
  const first = refs[0];
  return `<span class="chip ${first.cls}" title="${esc(refs.map(r => r.name).join(', '))}">${first.cls === 'tag' ? svg('tag') : ''}${esc(first.name)}</span>` + (refs.length > 1 ? `<span class="chip more" title="${esc(refs.map(r => r.name).join(', '))}">+${refs.length - 1}</span>` : '');
}
function rowHtml(c, gcell, refs, out, sel){
  return `<div class="gridrow crow${sel ? ' selected' : ''}" data-sha="${c.sha}" role="row">` +
    `<span class="c-ref">${chipsHtml(refs)}</span><span class="c-graph">${gcell}</span>` +
    `<span class="c-msg">${out ? svg('up', 'out') : ''}<span class="m" title="${esc(firstLine(c.msg))}">${esc(firstLine(c.msg))}</span></span>` +
    `<span class="c-author">${avatar(c.author)}<span style="overflow:hidden;text-overflow:ellipsis">${esc(c.author)}</span></span>` +
    `<span class="c-date" title="${esc(absDate(c.t))}">${esc(fmtDate(c.t))}</span><span class="c-id">${short(c.sha)}</span></div>`;
}
function renderGraph(){
  const cb = curBranch();
  const followingHead = !R.historyRef && !R.showAll;
  $('#viewRefBtn').innerHTML = esc(R.showAll ? t('gr.all') : (R.historyRef || cb || 'HEAD (' + s7(headSha()) + ')')) + svg('chevDown');
  // incoming / outgoing sections: only when looking at the current branch
  let sh = '';
  const outSet = followingHead ? outgoingSet() : new Set();
  if (followingHead && cb){
    const inc = incomingList();
    sh += `<div class="gsec${R.incOpen ? ' open' : ''}"><button class="tog" data-inc aria-expanded="${R.incOpen}">${svg('chev', 'chev')}<span>${esc(t('gr.incoming', { n: inc.length }))}</span></button><span class="sp"></span><button class="link sync-op" data-act="fetch">Fetch</button><span class="sep-dot">|</span><button class="link sync-op" data-act="pull">Pull</button></div>`;
    if (R.incOpen) sh += inc.length ? `<div class="inc-list">${inc.map(c => rowHtml(c, '', null, false, R.selected === c.sha)).join('')}</div>` : `<div class="inc-empty">${esc(t('gr.noIncoming'))}</div>`;
    sh += `<div class="gsec"><strong style="font-size:12px">${esc(t('gr.localHistory', { n: outSet.size }))}</strong><span class="sp"></span><button class="link sync-op" data-act="push">Push</button><span class="sep-dot">|</span><button class="link sync-op" data-act="sync">Sync</button></div>`;
  } else sh += `<div class="gsec"><strong style="font-size:12px">${esc(t('gr.history'))}</strong></div>`;
  $('#syncSections').innerHTML = sh;

  const tips = viewTips(), set = new Set();
  tips.forEach(s => ancestors(s).forEach(x => set.add(x)));
  let rows = [...set].map(x => R.commits[x]).sort((a, b) => b.t - a.t);
  const q = $('#historyFilter').value.trim().toLowerCase();
  const refs = refsByCommit();
  const body = $('#graphBody'), st = body.scrollTop;
  if (q){
    rows = rows.filter(c => (c.msg + ' ' + c.author + ' ' + c.sha + ' ' + (refs[c.sha] || []).map(r => r.name).join(' ')).toLowerCase().indexOf(q) >= 0);
    body.style.setProperty('--gw', '40px'); $('#thead').style.setProperty('--gw', '40px');
    body.innerHTML = rows.length ? rows.map(c => rowHtml(c, '', refs[c.sha], outSet.has(c.sha), R.selected === c.sha)).join('') : `<div class="g-empty">${esc(t('gr.noResults', { q: $('#historyFilter').value.trim() }))}</div>`;
  } else {
    const lay = layout(rows);
    const maxCols = lay.reduce((m, l) => Math.max(m, l.before.length, l.after.length, l.col + 1), 1);
    const gw = Math.max(40, LX(maxCols - 1) + 10);
    body.style.setProperty('--gw', gw + 'px'); $('#thead').style.setProperty('--gw', gw + 'px');
    const hs = headSha();
    body.innerHTML = lay.map(l => rowHtml(l.c, rowSvg(l, gw, hs, l.c.parents.length > 1), refs[l.c.sha], outSet.has(l.c.sha), R.selected === l.c.sha)).join('');
  }
  body.scrollTop = st;
}
function renderDetail(){
  const el = $('#detail'), c = R.selected && R.commits[R.selected];
  if (!c){ el.hidden = true; return; }
  const files = filesOf(c), rest = c.msg.split('\n').slice(1).join('\n').trim();
  el.hidden = false;

function pullOther(b){ // fast-forward a branch that isn't checked out (git fetch origin b:b)
  gitFetch(true);
  const br = R.branches[b];
  if (!br || !br.upstream || !R.remotes[br.upstream]){ notice('info', t('n.noUpstream', { b })); return; }
  const up = R.remotes[br.upstream];
  if (ancestors(br.tip).has(up)){ log(`git fetch origin ${b}:${b}`, ['Already up to date.']); notice('info', t('n.upToDate')); return; }
  if (ancestors(up).has(br.tip)){ const n = onlyIn(up, br.tip).length; br.tip = up; log(`git fetch origin ${b}:${b}`, [`   ${s7(br.tip)}  ${b} -> ${b}`]); notice('ok', t('n.pulled', { n, c: w(n, 'commit', 'commits'), u: br.upstream })); return; }
  log(`git fetch origin ${b}:${b}`, [{ text: ` ! [rejected]        ${b} -> ${b}  (non-fast-forward)`, kind: 'err' }]);
  notice('warn', t('n.pushRejected'));
}

function fileAct(a, path){
  const f = R.work.find(x => x.path === path); if (!f) return;
  if (a === 'stage'){ f.staged = true; log(`git add -- ${path}`, []); }
  else if (a === 'unstage'){ f.staged = false; log(`git restore --staged -- ${path}`, []); }
  else if (a === 'discard'){

    toast(t('n.discarded', { f: baseOf(path) }), { label: t('n.undo'), fn: () => { R.work.splice(Math.min(i, R.work.length), 0, copy); log(`(undo) restored ${path}`, [], 'app'); renderAll(); } });
  }
  renderAll();
}

function fakeDiff(f){
  const name = baseOf(f.path), stem = name.replace(/\.\w+$/, '').replace(/[^a-z0-9_]/gi, '_'), ext = (name.split('.').pop() || '').toLowerCase();
  let base, changed;
  if (ext === 'py'){
    base = ['import logging', 'from datetime import timedelta', '', 'log = logging.getLogger(__name__)', '', '', `def ${stem}(session):`, `    """Refresh the ${stem.replace(/_/g, ' ')} for an active session."""`, '    ttl = timedelta(minutes=15)', '    token = session.refresh()', '    return token'];
    changed = ['import logging', 'from datetime import timedelta', '', 'log = logging.getLogger(__name__)', 'DEFAULT_TTL = timedelta(minutes=30)', '', `def ${stem}(session, ttl=DEFAULT_TTL):`, `    """Refresh the ${stem.replace(/_/g, ' ')} for an active session."""`, '    token = session.refresh(ttl=ttl)', '    log.debug("refreshed %s", token.id)', '    return token'];
  } else if (ext === 'md'){
    base = [`# ${stem}`, '', 'GitDesk is a Git client for the Linux desktop.', '', '## Setup', '', '```', 'pip install gitdesk', '```'];
    changed = [`# ${stem}`, '', 'GitDesk is a Git client for the Linux desktop.', '', '## Setup', '', '```', 'pipx install gitdesk', 'gitdesk --repo ~/src/project', '```', '', 'Language: Settings → Options → General.'];
  } else if (ext === 'json'){
    base = ['{', '  "m.file": "File",', '  "m.edit": "Edit"', '}'];
    changed = ['{', '  "m.file": "Archivo",', '  "m.edit": "Editar",', '  "m.view": "Ver"', '}'];
  } else {
    base = [`# ${name}`, 'key: value', 'enabled: false', 'retries: 3'];
    changed = [`# ${name}`, 'key: value', 'enabled: true', 'retries: 5', 'timeout: 30s'];
  }
  const rows = [];
  if (f.st === 'A'){ rows.push({ k: 'meta', t: 'new file mode 100644' }, { k: 'hunk', t: `@@ -0,0 +1,${changed.length} @@` }); changed.forEach((l, i) => rows.push({ k: 'add', o: '', n: i + 1, t: '+' + l })); }
  else if (f.st === 'D'){ rows.push({ k: 'meta', t: 'deleted file mode 100644' }, { k: 'hunk', t: `@@ -1,${base.length} +0,0 @@` }); base.forEach((l, i) => rows.push({ k: 'del', o: i + 1, n: '', t: '-' + l })); }
  else {
    if (f.st === 'R' && f.from) rows.push({ k: 'meta', t: `rename from ${f.from}` }, { k: 'meta', t: `rename to ${f.path}` });
    rows.push({ k: 'hunk', t: `@@ -1,${base.length} +1,${changed.length} @@` });
    let i = 0, j = 0;
    while (i < base.length || j < changed.length){
      if (i < base.length && j < changed.length && base[i] === changed[j]){ rows.push({ k: '', o: i + 1, n: j + 1, t: ' ' + base[i] }); i++; j++; }
      else {
        const inChanged = i < base.length ? changed.indexOf(base[i], j) : -1;
        if (i < base.length && inChanged < 0){ rows.push({ k: 'del', o: i + 1, n: '', t: '-' + base[i] }); i++; }
        else { rows.push({ k: 'add', o: '', n: j + 1, t: '+' + changed[j] }); j++; }
      }
    }
  }
  return rows;
}

  const sub = ctx && R.commits[ctx] ? t('dl.diffCommit', { sha: s7(ctx) }) : t('dl.diffWork');

      check('opAvatars', t('op.avatars'), S.avatars) + `</div>` +
    `<div class="opt-panel" data-panel="git">` +
      `<div class="cmp-cols">${field(t('op.userName'), `<input class="inp" id="opName" value="${esc(S.userName)}">`)}${field(t('op.email'), `<input class="inp" id="opEmail" type="email" value="${esc(S.email)}" placeholder="you@example.com">`)}</div><div class="hint">${esc(t('op.identityNote'))}</div>` +
      field(t('op.defaultBranch'), `<input class="inp" id="opDefault" value="${esc(S.defaultBranch)}" style="max-width:220px">`) +
      field(t('op.autoFetch'), `<select class="inp" id="opAuto" style="max-width:260px">${['off', '30', '300', '900'].map(v => `<option value="${v}"${S.autoFetch === v ? ' selected' : ''}>${esc(t('op.af.' + v))}</option>`).join('')}</select>`) +
      check('opPrune', t('op.prune'), S.prune) + check('opPush', t('op.pushAfterCommit'), S.pushAfterCommit) + check('opConfirm', t('op.confirmDelete'), S.confirmDelete) + `</div>` +
    `<div class="opt-panel" data-panel="keyboard">${shortcutsHtml()}</div>` +
    `</div></div>`;
  dialog({ title: t('op.title'), wide: true, body,
    actions: [{ label: t('dl.cancel') }, { label: t('dl.save'), primary: true, fn: d => {
      const segVal = id => d.$(`#${id} [aria-pressed="true"]`).dataset.v;
      Object.assign(S, { lang: segVal('opLang'), theme: segVal('opTheme'), dateFmt: segVal('opDate'), avatars: d.$('#opAvatars').checked,
        userName: d.$('#opName').value.trim() || S.userName, email: d.$('#opEmail').value.trim(), defaultBranch: d.$('#opDefault').value.trim() || 'main',
        autoFetch: d.$('#opAuto').value, prune: d.$('#opPrune').checked, pushAfterCommit: d.$('#opPush').checked, confirmDelete: d.$('#opConfirm').checked });
      Object.values(REPOS).forEach(r => { r.notice = null; }); saveSettings(); setupAutoFetch();
      log(`git config user.name "${S.userName}"`, S.email ? [] : [], 'git');
      if (S.email) log(`git config user.email "${S.email}"`, []);
      appLog('settings saved');
      renderAll(); toast(t('n.settingsSaved'));
    } }],
    onMount: d => {
      const show = k => { d.$$('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); d.$$('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== k; }); };
      show(tab || 'general');
      d.el.addEventListener('click', e => {
        const tb = e.target.closest('[data-tab]'); if (tb) show(tb.dataset.tab);
        const sb = e.target.closest('.seg button'); if (sb){ $$('button', sb.parentNode).forEach(x => x.setAttribute('aria-pressed', x === sb)); }
      });
    } });
}
function shortcutsHtml(){
  const k = [['ks.commit', 'Ctrl+Enter'], ['ks.fetch', 'Ctrl+Shift+F'], ['ks.find', 'Ctrl+F'], ['ks.sidebar', 'Ctrl+B'], ['ks.dock', 'Ctrl+Shift+G'], ['ks.output', 'Ctrl+J'], ['ks.options', 'Ctrl+,'], ['ks.checkout', 'Enter · ' + t('ks.dbl')], ['ks.delete', 'Del'], ['ks.menu', 'Shift+F10'], ['ks.move', '↑ ↓'], ['ks.close', 'Esc']];
  return `<div class="kbd-list">${k.map(x => `<span>${esc(t(x[0]))}</span><span>${x[1].split(' · ').map(s => s.indexOf('+') > 0 || s.length < 6 ? `<kbd>${esc(s)}</kbd>` : esc(s)).join(' · ')}</span>`).join('')}</div>`;
}
function dlgShortcuts(){ dialog({ title: t('dl.shortcuts'), body: shortcutsHtml(), actions: [{ label: t('dl.close'), primary: true }] }); }
function dlgAbout(){ dialog({ title: t('dl.about'), body: `<div style="display:flex;gap:12px;align-items:center">${svg('logo').replace('class="ic"', 'class="ic" style="width:36px;height:36px;color:var(--brand)"')}<strong style="font-size:15px">GitDesk ${VERSION}</strong></div><p style="margin:0">${esc(t('about.body', { v: VERSION }))}</p><p class="hint" style="margin:0">${esc(t('about.proto'))}</p>`, actions: [{ label: t('dl.close'), primary: true }] }); }

// ---------- window controls ----------
function shutdown(title, text, btn){
  const s = $('#shutdown'); $('#shutTitle').textContent = title; $('#shutText').textContent = text; $('#shutBtn').textContent = btn; s.hidden = false; $('#shutBtn').focus();
}
function winClose(){
  const n = R.work.length;
  const go = () => { appLog('window closed'); shutdown(t('closed.title'), t('closed.text'), t('closed.reopen')); };
  if (!n){ go(); return; }
  confirmDlg(t('close.title'), esc(t('close.body', { n, ch: w(n, 'change', 'changes') })), t('close.btn'), false, go);
}
function winMin(){ appLog('window minimized'); shutdown(t('n.minimized'), t('min.text'), t('min.restore')); }
function winMax(){
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast(t('n.fullscreen')));
    else toast(t('n.fullscreen'));
  } catch (e){ toast(t('n.fullscreen')); }
}

// ---------- auto-fetch ----------
let autoTimer = null;
function setupAutoFetch(){
  clearInterval(autoTimer); autoTimer = null;
  if (S.autoFetch === 'off') return;
  autoTimer = setInterval(() => {
    if (busy) return;
    if (Math.random() < 0.5) simTeammate();
    const n = gitFetch(true);
    if (n) toast(t('n.autoFetch', { n }), { label: 'Pull', fn: () => act.pull() });
    renderAll();
  }, (+S.autoFetch) * 1000);
}

// ---------- event wiring ----------
function wire(){
  $$('i[data-ic]').forEach(el => { el.outerHTML = svg(el.dataset.ic); });

  // any [data-act] button
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = act[b.dataset.act]; if (a) a();
  });

  // title bar
  $('#langBtn').addEventListener('click', () => setLang(S.lang === 'es' ? 'en' : 'es'));
  $('#themeBtn').addEventListener('click', () => setTheme({ auto: 'light', light: 'dark', dark: 'auto' }[S.theme]));
  $('#winMin').addEventListener('click', winMin);
  $('#winMax').addEventListener('click', winMax);
  $('#winClose').addEventListener('click', winClose);
  $('#shutBtn').addEventListener('click', () => { $('#shutdown').hidden = true; appLog('window restored'); renderAll(); });

  // menubar
  const openMain = b => { const el = menuAt(b, mainMenu(b.dataset.menu)); if (el){ b.setAttribute('aria-expanded', 'true'); } };
  $$('.menubar .mb').forEach(b => {
    b.addEventListener('click', () => { const was = menuAnchor === b; closeMenus(); if (!was) openMain(b); });
    b.addEventListener('mouseenter', () => { if (menuAnchor && menuAnchor.classList && menuAnchor.classList.contains('mb') && menuAnchor !== b){ closeMenus(); openMain(b); } });
  });

  // sidebar tree
  const tr = $('#tree');
  tr.addEventListener('click', e => {
    const sec = e.target.closest('[data-sec]'); if (sec){ const k = sec.dataset.sec; R.secClosed.has(k) ? R.secClosed.delete(k) : R.secClosed.add(k); renderSidebar(); return; }
    if (e.target.closest('[data-addsub]')){ dlgSubmodule(); return; }
    const pm = e.target.closest('[data-prmenu]'); if (pm){ menuAt(pm, [{ label: t('g.newPR'), icon: 'pr', disabled: !curBranch(), action: () => dlgNewPR(curBranch()) }, { label: t('gr.refresh'), icon: 'refresh', action: () => { log('gh pr list', R.prs.map(p => `#${p.id}\t${p.title}\t${p.source}\t${p.status}`)); renderAll(); } }], true); return; }
    const rs = e.target.closest('[data-rmsub]'); if (rs){ const s = R.submodules.splice(+rs.dataset.rmsub, 1)[0]; log(`git rm ${s.path}`, [`rm '${s.path}'`]); R.work.push({ path: s.path, st: 'D', staged: true }); renderAll(); return; }
    const rw = e.target.closest('[data-rmwt]'); if (rw){ const x = R.worktrees.splice(+rw.dataset.rmwt, 1)[0]; log(`git worktree remove ${x.path}`, []); renderAll(); return; }
    const pr = e.target.closest('[data-pr]'); if (pr){ dlgPR(+pr.dataset.pr); return; }
    const f = e.target.closest('[data-folder]'); if (f){ const k = f.dataset.folder; R.openFolders.has(k) ? R.openFolders.delete(k) : R.openFolders.add(k); renderSidebar(); return; }
    const r = e.target.closest('[data-ref]'); if (r){ R.selRef = r.dataset.ref; R.historyRef = r.dataset.ref === curBranch() ? null : r.dataset.ref; R.showAll = false; $$('.trow.selected', tr).forEach(x => x.classList.remove('selected')); r.classList.add('selected'); r.focus(); renderGraph(); renderChrome(); return; }
    if (e.target.closest('[data-root]')){ R.historyRef = null; R.selRef = null; renderAll(); }
  });
  tr.addEventListener('dblclick', e => { const r = e.target.closest('[data-ref]'); if (r){ gitCheckout(r.dataset.ref); renderAll(); if (isNarrow()) $('#app').classList.remove('drawer-sidebar'); renderLayout(); } });
  tr.addEventListener('contextmenu', e => {
    const r = e.target.closest('[data-ref]'); if (!r) return;
    e.preventDefault(); R.selRef = r.dataset.ref; $$('.trow.selected', tr).forEach(x => x.classList.remove('selected')); r.classList.add('selected'); r.focus();
    showMenu(refMenu(r.dataset.ref), e.clientX, e.clientY);
  });
  tr.addEventListener('keydown', e => {
    const rows = $$('[data-ref]', tr); const i = rows.findIndex(x => x.dataset.ref === R.selRef);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) n.click(); }
    else if (e.key === 'Enter' && R.selRef){ gitCheckout(R.selRef); renderAll(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && R.selRef){ e.preventDefault(); dlgDelete(R.selRef); }
    else if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu'){ const row = rows[i]; if (row){ e.preventDefault(); const rc = row.getBoundingClientRect(); showMenu(refMenu(R.selRef), rc.left + 40, rc.bottom); } }
  });
  $('#branchFilter').addEventListener('input', renderSidebar);

  // graph
  const gp = $('#graphPane');
  gp.addEventListener('click', e => {
    if (e.target.closest('[data-inc]')){ R.incOpen = !R.incOpen; renderGraph(); return; }
    const row = e.target.closest('.crow');
    if (row){ R.selected = row.dataset.sha; renderGraph(); renderDetail(); $('#graphBody').focus({ preventScroll: true }); return; }
    const dt = e.target.closest('[data-dact]');
    if (dt){ const a = dt.dataset.dact; if (a === 'close'){ R.selected = null; renderDetail(); renderGraph(); } else if (a === 'copy') copyText(R.selected); else if (a === 'menu') menuAt(dt, commitMenu(R.selected), true); return; }
    const go = e.target.closest('[data-goto]'); if (go){ R.selected = go.dataset.goto; renderGraph(); renderDetail(); const el = $(`.crow[data-sha="${go.dataset.goto}"]`); if (el) el.scrollIntoView({ block: 'nearest' }); return; }
    const fr = e.target.closest('#detail .frow'); if (fr){ const c = R.commits[R.selected]; dlgDiff(filesOf(c).find(x => x.path === fr.dataset.path), R.selected); }
  });
  gp.addEventListener('contextmenu', e => { const row = e.target.closest('.crow'); if (!row) return; e.preventDefault(); R.selected = row.dataset.sha; renderGraph(); renderDetail(); showMenu(commitMenu(row.dataset.sha), e.clientX, e.clientY); });
  $('#graphBody').addEventListener('keydown', e => {
    const rows = $$('.crow', $('#graphBody')); const i = rows.findIndex(r => r.dataset.sha === R.selected);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n){ R.selected = n.dataset.sha; renderGraph(); renderDetail(); const el = $(`#graphBody .crow[data-sha="${R.selected}"]`); if (el) el.scrollIntoView({ block: 'nearest' }); } }
    else if (((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') && R.selected){ e.preventDefault(); const el = rows[i]; const rc = el.getBoundingClientRect(); showMenu(commitMenu(R.selected), rc.left + 200, rc.bottom); }
    else if (e.key === 'Escape'){ R.selected = null; renderGraph(); renderDetail(); }
  });
  $('#historyFilter').addEventListener('input', renderGraph);
  $('#viewRefBtn').addEventListener('click', e => menuAt(e.currentTarget, viewRefMenu()));

  // output
  $('#outChannel').addEventListener('change', renderOutput);
  $('#outClear').addEventListener('click', () => { const ch = $('#outChannel').value; for (let i = OUT.length - 1; i >= 0; i--) if (OUT[i].ch === ch) OUT.splice(i, 1); renderOutput(); });

  // dock
  $('#branchSelect').addEventListener('click', e => branchPicker(e.currentTarget));
  $('#dockMore').addEventListener('click', e => menuAt(e.currentTarget, dockMoreMenu(), true));
  $('#dockCounts').addEventListener('click', e => menuAt(e.currentTarget, syncMenu()));
  $('#commitMore').addEventListener('click', e => menuAt(e.currentTarget, commitMoreMenu()));
  $('#commitBtn').addEventListener('click', () => act.commit());
  $('#hashBtn').addEventListener('click', e => { if (menuAnchor === e.currentTarget) closeMenus(); else issuePicker(e.currentTarget, false); });
  const ta = $('#commitMsg');
  ta.addEventListener('input', e => { R.msg = ta.value; renderDock(); if (e.data === '#') issuePicker($('#hashBtn'), true); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); act.commit(); } });
  $('#amendCb').addEventListener('change', e => {
    const h = R.commits[headSha()];
    if (e.target.checked && !ta.value.trim()) ta.value = h.msg;
    else if (!e.target.checked && ta.value === h.msg) ta.value = '';
    R.msg = ta.value; renderDock();
  });
  $('#notice').addEventListener('click', e => {
    const b = e.target.closest('[data-nact]'); if (!b) return;
    const n = R.notice; R.notice = null;
    if (b.dataset.nact !== 'x' && n) n.actions[+b.dataset.nact].fn();
    renderDock();
  });
  const cs = $('#changesScroll');
  cs.addEventListener('click', e => {
    const s = e.target.closest('[data-dsec]'); if (s){ const k = s.dataset.dsec; R.dockClosed.has(k) ? R.dockClosed.delete(k) : R.dockClosed.add(k); renderDock(); return; }
    const tl = e.target.closest('[data-dtool]'); if (tl){ act[tl.dataset.dtool](); return; }
    const ur = e.target.closest('[data-unrel]'); if (ur){ R.related = R.related.filter(x => x !== +ur.dataset.unrel); ta.value = ta.value.replace(new RegExp('\\s?#' + ur.dataset.unrel + '\\b'), ''); R.msg = ta.value; renderDock(); return; }
    const fa = e.target.closest('[data-fact]'); if (fa){ const p = fa.closest('.frow').dataset.path; if (fa.dataset.fact === 'diff') dlgDiff(R.work.find(x => x.path === p)); else fileAct(fa.dataset.fact, p); return; }
    const sa = e.target.closest('[data-sact]'); if (sa){ const i = +sa.closest('[data-stash]').dataset.stash; if (sa.dataset.sact === 'drop') gitStashDrop(i); else gitStashApply(i, sa.dataset.sact === 'pop'); renderAll(); return; }
    const st = e.target.closest('[data-stash]'); if (st){ dlgStash(+st.dataset.stash); return; }
    const fr = e.target.closest('.frow[data-path]'); if (fr){ dlgDiff(R.work.find(x => x.path === fr.dataset.path)); }
  });
  cs.addEventListener('dblclick', e => { const fr = e.target.closest('.frow[data-path]'); if (fr && !e.target.closest('button')){ const f = R.work.find(x => x.path === fr.dataset.path); if (f) fileAct(f.staged ? 'unstage' : 'stage', f.path); } });
  cs.addEventListener('contextmenu', e => {
    const fr = e.target.closest('.frow[data-path]');
    if (fr){ e.preventDefault(); showMenu(fileMenu(fr.dataset.path), e.clientX, e.clientY); return; }
    const st = e.target.closest('[data-stash]');
    if (st){ e.preventDefault(); const i = +st.dataset.stash; showMenu([{ label: t('dk.apply'), icon: 'check', action: () => { gitStashApply(i, false); renderAll(); } }, { label: t('dk.pop'), icon: 'up', action: () => { gitStashApply(i, true); renderAll(); } }, { divider: true }, { label: t('dk.drop'), icon: 'trash', action: () => { gitStashDrop(i); renderAll(); } }], e.clientX, e.clientY); }
  });

  // status bar
  $('#sbSync').addEventListener('click', e => menuAt(e.currentTarget, syncMenu()));
  $('#sbChanges').addEventListener('click', () => { act.showDock(); ta.focus(); });
  $('#sbBranch').addEventListener('click', e => branchPicker(e.currentTarget));
  $('#sbRepo').addEventListener('click', e => menuAt(e.currentTarget, repoMenuItems(), true));

  // mobile backdrop
  $('#backdrop').addEventListener('click', () => { $('#app').classList.remove('drawer-sidebar', 'drawer-dock'); renderLayout(); });

  // global keyboard
  document.addEventListener('keydown', e => {
    const menuOpen = $('.menu, .popover');
    if (e.key === 'Escape' && menuOpen){ e.preventDefault(); closeMenus(); return; }
    if (menuOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
      const menus = $$('.menu'); const m = menus[menus.length - 1] || menuOpen;
      const items = $$('.mi:not(:disabled)', m); const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; if (n) n.focus(); }
      else if (e.key === 'ArrowRight' && document.activeElement && document.activeElement._openSub){ e.preventDefault(); document.activeElement._openSub(); const s = $$('.menu').pop(); const f = s && s.querySelector('.mi:not(:disabled)'); if (f) f.focus(); }
      else if (e.key === 'ArrowLeft' && m._parent){ e.preventDefault(); const from = m._from; closeSub(m._parent); from.focus(); }
      return;
    }
    if ($('.dlg-backdrop')) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && e.shiftKey && k === 'f'){ e.preventDefault(); act.fetch(); }
    else if (mod && e.shiftKey && k === 'g'){ e.preventDefault(); act.toggleDock(); }
    else if (mod && !e.shiftKey && k === 'f'){ e.preventDefault(); act.focusFilter(); }
    else if (mod && !e.shiftKey && k === 'b'){ e.preventDefault(); act.toggleSidebar(); }
    else if (mod && !e.shiftKey && k === 'j'){ e.preventDefault(); act.toggleOutput(); }
    else if (mod && e.key === ','){ e.preventDefault(); dlgOptions(); }
    else if (mod && k === 'q'){ e.preventDefault(); winClose(); }
    else if (e.key === 'F5'){ e.preventDefault(); act.refresh(); }
  });

  setInterval(() => { if (!busy && !$('.menu, .popover')) renderGraph(); }, 60000);
}

// ---------- boot ----------
seedGitdesk();
wire();
log('git status -sb', ['## main...origin/main', ' M src/auth/token_service.py', '?? tests/auth/test_token_rotation.py', ' R src/web/login_view.py -> src/web/session_view.py', 'D  src/auth/legacy_session.py']);
appLog('GitDesk ' + VERSION + ' ready — ' + R.name);
setupAutoFetch();
renderAll();
})();
</script>
