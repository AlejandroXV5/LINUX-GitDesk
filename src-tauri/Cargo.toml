[package]
name = "gitdesk"
version = "0.1.0"
description = "GitDesk — a Git client for the Linux desktop"
authors = ["GitDesk contributors"]
edition = "2021"
license = "LicenseRef-Proprietary"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "gitdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
